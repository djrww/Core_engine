name: CI

on:
  push:
    branches: [main, C1, CC1, CC2, CC2.1, "CC*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: "checks · rust 1.98.0 (clippy / rustfmt / rust-analyzer)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install system dependencies (why3 + z3)
        run: |
          sudo apt-get update
          sudo apt-get install -y why3 z3
          why3 config detect || true

      - name: install rust 1.98.0 + clippy + rustfmt + rust-analyzer
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt, rust-analyzer

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --all-targets -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-targets

      - name: install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # F-13:覆蓋率由「只觀測」升級為「有門」。
      # 錨定值說明:2026-09-05 實測行覆蓋率 71.3%(rust 1.98.0,lcov 逐檔加總,CI run 33961021652 產物);
      # 門檻錨定 65% 防退化,後續應以上調方式逼近審計建議的 95%。
      - name: 'generate test code coverage report (gate: lines >= 65%)'
        run: cargo llvm-cov --all-features --workspace --summary-only --fail-under-lines 65

      - name: upload lcov coverage artifact
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: attach coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 90

      - name: mechanical self-verification (dev_loop / verify_all / dd_verify / cl0r0 / macro_lab / l9newman / fuzz / cert_factory / pipeline_runner / ci_verify / lemma_stress_coverage / rocq_verify / creusot_verify / dev_prover)
        run: |
          cargo run --bin dev_loop
          cargo run --bin cl0r0
          cargo run --bin l9newman
          cargo run --bin dd_verify
          cargo run --bin macro_lab
          cargo run --bin verify_all
          cargo run --bin pipeline_runner
          cargo run --bin cert_factory
          cargo run --bin fuzz
          cargo run --bin lemma_stress_coverage
          cargo run --bin ci_verify
          cargo run --bin rocq_verify
          cargo run --bin creusot_verify
          cargo run --bin dev_prover

  release:
    name: "release · LTO + opt-level 3"
    needs: checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: install rust 1.98.0
        uses: dtolnay/rust-toolchain@1.98.0

      - uses: Swatinem/rust-cache@v2

      - name: verify tag == crate version
        run: |
          crate_ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag_ver=${GITHUB_REF_NAME#v}
          if [ "$crate_ver" != "$tag_ver" ]; then
            echo "::error::tag v$tag_ver != Cargo.toml version $crate_ver"
            exit 1
          fi

      - name: cargo build --release (lto=true, opt-level=3, codegen-units=1)
        run: cargo build --release

      - name: package binaries
        run: |
          tag=${GITHUB_REF_NAME}
          tar czf "cl0r0-${tag}-x86_64-unknown-linux-gnu.tar.gz" \
            -C target/release cl0r0 dev_loop l9newman dd_verify macro_lab verify_all pipeline_runner cert_factory coco_benchmark fuzz fuzz_daemon cl0r0_lsp lemma_stress_coverage ci_verify rocq_verify creusot_verify

      - name: create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=${GITHUB_REF_NAME}
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "cl0r0-${tag}-x86_64-unknown-linux-gnu.tar.gz" --clobber
          else
            gh release create "$tag" "cl0r0-${tag}-x86_64-unknown-linux-gnu.tar.gz" \
              --title "$tag (rust 1.98.0 · lto + opt-level 3)" \
              --notes "rust 1.98.0 · opt-level=3 · lto=true · codegen-units=1 · debug=true (SOTA Decreasing Diagrams + Newman Fast Path + 5-Cluster Synthesis & Cert Generator Factory)"
          fi
